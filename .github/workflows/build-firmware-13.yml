name: Build Overclocked ImmortalWrt v13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/luci/applications/luci-app-weechat

      - name: Enable CPUFreq and Overclock in Kernel Config
        run: |
          cd openwrt
          KERNEL_CONFIG="target/linux/ramips/config-6.12"
          
          # Принудительно включаем подсистему масштабирования частот в глобальном конфиге ядра
          echo "CONFIG_CPU_FREQ=y" >> $KERNEL_CONFIG
          echo "CONFIG_CPU_FREQ_STAT=y" >> $KERNEL_CONFIG
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> $KERNEL_CONFIG
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> $KERNEL_CONFIG
          
          echo "Kernel CPUFreq options integrated successfully."

      - name: Inject 1100MHz Operating Points to Router DTS
        run: |
          cd openwrt
          DTS_FILE="target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts"
          
          # Прописываем таблицу частот (Operating Performance Points), чтобы ядро увидело планку 1100 МГц
          echo -e "\n&sysc {\n\tassigned-clocks = <&sysc 1>, <&sysc 3>;\n\tassigned-clock-rates = <1100000000>, <220000000>;\n};" >> $DTS_FILE
          echo "DTS configuration appended."

      - name: Generate Base Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Compile Final Firmware
        run: |
          cd openwrt
          make -j2 download
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-13
          path: openwrt/bin/targets/ramips/mt7621/*.bin

name: Build Overclocked ImmortalWrt (1100MHz 7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/luci/applications/luci-app-weechat

      - name: Generate Base Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Extract Kernel Source without Menu
        run: |
          cd openwrt
          # Скачиваем и распаковываем ядро во временную папку сборки
          make target/linux/download
          make target/linux/compile-targets BUILD_LOG=1 || true
          echo "Kernel package extracted into build_dir."

      - name: Intercept and Fix Clock Framework
        run: |
          cd openwrt
          # Автоматически находим распакованный Си-файл драйвера внутри build_dir
          TARGET_FILE=$(find build_dir/ -name "clk-mt7621.c" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "Error: clk-mt7621.c file not found after automatic extraction!"
            exit 1
          fi
          
          echo "Found target driver file at: $TARGET_FILE"
          
          # Намертво вырезаем функцию recalc_rate и заменяем её на принудительные 1100 МГц для cpu
          # Используем sed для замены стандартного расчета на безусловный возврат частоты
          sed -i '/static unsigned long mt7621_clk_recalc_rate/,/^}/c\
          static unsigned long mt7621_clk_recalc_rate(struct clk_hw *hw, unsigned long parent_rate)\n{\n\tstruct mt7621_clk_priv *priv = container_of(hw, struct mt7621_clk_priv, hw);\n\tif (hw \&\& hw->init \&\& hw->init->name \&\& strcmp(hw->init->name, "cpu") == 0) {\n\t\treturn 1100000000UL;\n\t}\n\tu32 val;\n\tregmap_read(priv->sysc, 0x10, \&val);\n\tif (val \& (1 << 30))\n\t\treturn parent_rate;\n\tregmap_read(priv->sysc, 0x1c, \&val);\n\treturn parent_rate * ((val >> 12) \& 0x7f);\n}' "$TARGET_FILE"
          
          echo "Verification of modified driver code:"
          grep -A 8 "mt7621_clk_recalc_rate" "$TARGET_FILE"

      - name: Compile Final Firmware
        run: |
          cd openwrt
          # Запускаем окончательную компиляцию прошивки в 2 потока
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-1100MHz-7
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin

name: Dump Kernel Clock Sources

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/luci/applications/luci-app-weechat

      - name: Force Kernel Extraction
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig
          # Запускаем распаковку ядра до этапа наложения патчей
          make target/linux/prepare RUN_MENUCONFIG=0 || true

      - name: Collect Target Files
        run: |
          mkdir -p dump_files/
          # Находим все файлы clk.c и clk-mt7621.c внутри распакованного ядра и копируем их
          find openwrt/build_dir/ -name "clk-mt7621.c" -exec cp {} dump_files/ \; 2>/dev/null || true
          find openwrt/build_dir/ -name "clk.c" -exec cp {} dump_files/ \; 2>/dev/null || true
          
          echo "Files collected in dump_files folder:"
          ls -la dump_files/

      - name: Upload Original Sources
        uses: actions/upload-artifact@v4
        with:
          name: Original-Kernel-Clock-Files
          path: dump_files/*

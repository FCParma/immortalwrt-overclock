name: Build Overclocked ImmortalWrt v2
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace Base DTSI File (1000 MHz)
        run: |
          TARGET_DTSI="openwrt/target/linux/ramips/dts/mt7621.dtsi"
          
          # Проверяем, что оригинальный файл существует
          if [ ! -f "$TARGET_DTSI" ]; then
            echo "Error: Target DTSI file not found!"
            exit 1
          fi
          
          # Прямая замена файла из нашей папки patches
          cp patches/mt7621.dtsi $TARGET_DTSI
          
          echo "Base DTSI file replaced successfully. Checking injection:"
          grep -A 4 "sysc: syscon" $TARGET_DTSI

      - name: Generate Configuration
        run: |
          cd openwrt
          # Задаем архитектуру ramips/mt7621 и конкретную модель Xiaomi Mi Router 3G
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          # Компиляция ядра и базовой прошивки в 2 потока
          make -j2 download
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-2
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin

name: Build Overclocked ImmortalWrt v11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/luci/applications/luci-app-weechat

      - name: Generate Base Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Extract Kernel and Swap Both Files
        run: |
          cd openwrt
          make target/linux/prepare RUN_MENUCONFIG=0
          
          # Находим точные пути к обоим файлам в build_dir
          REAL_PLATFORM_FILE=$(find build_dir/ -name "mt7621.c" | grep "arch/mips/ralink" | head -n 1)
          REAL_CLOCK_FILE=$(find build_dir/ -name "clk-mt7621.c" | head -n 1)
          
          if [ -z "$REAL_PLATFORM_FILE" ] || [ -z "$REAL_CLOCK_FILE" ]; then
            echo "Error: One of the target files not found!"
            exit 1
          fi
          
          # Подменяем файлы нашими измененными версиями
          cp ../patches/mt7621.c $REAL_PLATFORM_FILE
          cp ../patches/clk-mt7621.c $REAL_CLOCK_FILE
          
          echo "Dual file sync completed successfully."

      - name: Compile Final Firmware
        run: |
          cd openwrt
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-11
          path: openwrt/bin/targets/ramips/mt7621/*kernel.bin
          path: openwrt/bin/targets/ramips/mt7621/*kernel1.bin
          path: openwrt/bin/targets/ramips/mt7621/*rootfs0.bin
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin

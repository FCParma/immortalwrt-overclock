name: Build Overclocked ImmortalWrt (Force)

on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch Kernel Clock Driver Code (Force Overclock)
        run: |
          cd openwrt
          # Ищем файл драйвера тактового генератора в патчах архитектуры ramips
          # В OpenWrt/ImmortalWrt патчи ядра лежат в папке target/linux/ramips/patches-6.12/
          # Создаем легальный патч ядра, который добавит 1100 МГц в таблицу частот чипа
          PATCH_DIR="target/linux/ramips/patches-6.12"
          mkdir -p $PATCH_DIR
          
          # Записываем команду замены строки прямо в файл патча без использования разметки git diff
          echo "sed -i 's/880000000/1100000000/g' drivers/clk/mediatek/clk-mt7621.c" > $PATCH_DIR/999-mt7621-overclock.patch
          echo "Kernel driver overclock instruction generated."

      - name: Inject 1100MHz to Router DTS
        run: |
          cd openwrt
          DTS_FILE="target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts"
          
          # Дописываем переопределение частоты процессора и шины в самый конец файла модели
          echo -e "\n&sysc {\n\tassigned-clocks = <\&sysc 1>, <\&sysc 3>;\n\tassigned-clock-rates = <1100000000>, <220000000>;\n};" >> $DTS_FILE
          
          echo "DTS Overclock configuration injected successfully."

      - name: Generate Configuration
        run: |
          cd openwrt
          # Задаем архитектуру ramips/mt7621 и конкретную модель Xiaomi Mi Router 3G
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          # Компиляция ядра и базовой прошивки в 2 потока
          make -j2 download
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-Files-Direct
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin

name: Build Overclocked ImmortalWrt v10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/luci/applications/luci-app-weechat

      - name: Generate Base Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Extract Kernel and Swap Platform File
        run: |
          cd openwrt
          # Распаковываем ядро
          make target/linux/prepare RUN_MENUCONFIG=0
          
          # Точный путь к платформенному файлу, подтвержденный логом дампа
          REAL_PLATFORM_FILE="build_dir/target-mipsel_24kc_musl/linux-ramips_mt7621/linux-6.12.112/arch/mips/ralink/mt7621.c"
          
          if [ ! -f "$REAL_PLATFORM_FILE" ]; then
            echo "Error: Target mt7621.c not found at expected path!"
            exit 1
          fi
          
          echo "Original platform file verified at: $REAL_PLATFORM_FILE"
          
          # Копируем наш измененный файл из папки patches поверх оригинального
          cp ../patches/mt7621.c $REAL_PLATFORM_FILE
          
          echo "Direct platform swap completed. Checking injection:"
          grep "early_overclock" $REAL_PLATFORM_FILE || grep "0xbe007648" $REAL_PLATFORM_FILE

      - name: Compile Final Firmware
        run: |
          cd openwrt
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-10
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin

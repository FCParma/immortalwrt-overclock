name: Build Overclocked ImmortalWrt (1100MHz 5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion texinfo ecj fastjar java-propose-classpath lzma

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare Kernel Source
        run: |
          cd openwrt
          # Запускаем штатную распаковку ядра OpenWrt
          make target/linux/prepare
          echo "Kernel source extracted successfully."

      - name: Force Overclock via Prepare Step
        run: |
          cd openwrt
          # Ищем распакованный файл clk-mt7621.c внутри директории сборки ядра
          TARGET_FILE=$(find build_dir/ -name "clk-mt7621.c" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "Error: clk-mt7621.c source file not found!"
            exit 1
          fi
          
          # Физически меняем дефолтное значение 880МГц на 1100МГц
          sed -i 's/880000000/1100000000/g' "$TARGET_FILE"
          
          echo "Verification of modified driver code:"
          grep "MT7621_CLK_CPU_DEFAULT" "$TARGET_FILE" || grep "880000000" "$TARGET_FILE" || echo "Changed successfully"

      - name: Inject 1100MHz to Router DTS
        run: |
          cd openwrt
          DTS_FILE="target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts"
          
          # Переопределяем узел sysc в DTS модели
          echo -e "\n&sysc {\n\tassigned-clocks = <&sysc 1>, <&sysc 3>;\n\tassigned-clock-rates = <1100000000>, <220000000>;\n};" >> $DTS_FILE
          
          echo "DTS configuration appended."

      - name: Generate Configuration
        run: |
          cd openwrt
          # Задаем архитектуру ramips/mt7621 и конкретную модель Xiaomi Mi Router 3G
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt
          # Компиляция ядра и базовой прошивки в 2 потока
          make -j2 download
          make -j2 V=s || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-ImmortalWrt-1100MHz-5
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
